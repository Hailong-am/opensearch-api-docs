# Amazon OpenSearch Serverless — hand-authored overlay (additions + schema-level removes).
#
# The single hand-authored AOSS overlay (the other file in overlays/aoss/,
# amazon-serverless-block.overlay.yaml, is the GENERATED path-block file and
# is regenerated by tools/generate-aoss-allowlist.py — never hand-edit it).
# This file carries everything the generated path-allowlist can't express:
# field/param-level removes on KEPT schemas, plus AOSS-only additions. Applied
# with the speakeasy overlay CLI (the tool the whole pipeline is standardized on).
#
# Contents (removes-first, then adds, so an add never targets a schema-properties
# map a later remove would touch):
#   1. refresh param/schema removal        (was aoss-refresh-remove)
#   2. unsettable index-settings removal   (was aoss-unsettable-index-settings-remove)
#   3. index-settings lifecycle extensions (was aoss-index-settings-extensions)
#   4. snapshot API extensions             (was aoss-snapshot-api-extensions)
#
# NOTE: section 1 uses $ref filter predicates (@.$ref =~ ...). openapi-overlays-js
# rejects these ("unsafe expression"); this overlay REQUIRES speakeasy to apply.
overlay: 1.0.0
info:
  title: Amazon OpenSearch Serverless - hand-authored overlay (additions + removes)
  version: 1.0.0
extends: ./opensearch-openapi.yaml

actions:
  # =========================================================================
  # 1. AOSS refresh parameter removal  (was aoss-refresh-remove.overlay.yaml)
  #
  # AOSS rejects EVERY explicit refresh value:
  #   refresh=true      -> 400 "true refresh policy is not supported."
  #   refresh=wait_for  -> 400 "wait_for refresh policy is not supported."
  #   refresh=false     -> 200
  # (empirically verified 2026-09-02 against a real SEARCH collection). Only the
  # default false works, so the write-op `refresh` query parameter is meaningless
  # on AOSS and is removed entirely. Requires speakeasy ($ref filter predicates).
  # =========================================================================
  # 1a. Remove every operation-level parameter that $refs a write-op refresh param.
  - target: '$.paths[*][*].parameters[?(@.$ref =~ /query\.refresh$/)]'
    remove: true
  # 1b. Remove the 14 shared refresh query-parameter component definitions.
  #     components.parameters is an object map; [*] iterates its values so the
  #     [?()] predicate can match (a bare [?()] on a map matches nothing).
  - target: '$.components.parameters[*][?(@.name == "refresh" && @.in == "query")]'
    remove: true
  # 1c. Remove the now-orphaned shared Refresh schema.
  - target: "$.components.schemas['_common___Refresh']"
    remove: true

  # =========================================================================
  # 2. AOSS structurally-unsettable index settings removal
  #    (was aoss-unsettable-index-settings-remove.overlay.yaml)
  #
  # On AOSS the collection owns shard/replica topology. number_of_shards and
  # number_of_replicas are NOT in the create-index allowlist
  # (SERVERLESS_EXTERNAL_SETTINGS in the Juno indexing coordinator) and -- unlike
  # most other AOSS gates -- have NO per-account dynamic-config escape hatch. No
  # account can ever set them, so they are removed from the AOSS IndexSettings
  # schema.
  #
  # CONTRAST: account-conditional settings (refresh_interval, index.warm.after,
  # custom doc id, kNN engine options, timestamp_field) are deliberately LEFT IN
  # -- a per-account override can enable them. Only the two structurally-impossible
  # topology settings are stripped here.
  # =========================================================================
  - target: "$.components.schemas['indices._common___IndexSettings'].properties.number_of_shards"
    remove: true
  - target: "$.components.schemas['indices._common___IndexSettings'].properties.number_of_replicas"
    remove: true

  # =========================================================================
  # 3. AOSS-only index lifecycle settings extensions
  #    (was aoss-index-settings-extensions.overlay.yaml)
  #
  # V2 collections expose data-lifecycle index settings with NO OSS counterpart.
  # Accepted by the metadata service (JunoMetadata branch 3.3) from the
  # create-index settings body, PUT /{index}/_settings, and index/component
  # templates; handled entirely in AOSS com.amazon.junometadataservice handler
  # code -- no OSS Setting<>, so absent from the base IndexSettings schema.
  #
  #   - index.data.retention  : V2 data-retention lifecycle (duration)
  #   - index.warm.after      : warm-tier migration threshold (duration)
  #   - index.timestamp_field : event-timestamp field driving time-based lifecycle
  #
  # Source: JunoMetadata SettingsUtil.INDEX_SETTING_DATA_RETENTION (SettingsUtil.java:63),
  #         SettingsUtil.INDEX_SETTING_WARM_AFTER (SettingsUtil.java:65),
  #         SettingsUtil.INDEX_TIMESTAMP_FIELD_SETTING ("CUSTOM AOSS SETTING").
  # =========================================================================
  - target: "$.components.schemas['indices._common___IndexSettings'].properties"
    description: >
      Add three AOSS-only (amazon-serverless) data-lifecycle index settings.
      All are absent from OSS OpenSearch (no Setting<> counterpart) and are
      accepted by the AOSS metadata service on the index settings body,
      PUT /{index}/_settings, and index/component templates.
    update:
      data.retention:
        x-distributions:
          - amazon-serverless
        $ref: '#/components/schemas/_common___Duration'
        description: >-
          AOSS-only. Data-retention period for a V2 collection index. After the
          configured duration elapses, the index's data becomes eligible for
          expiry per the collection's lifecycle policy. Expressed as a duration
          string (e.g. `7d`, `24h`).
      warm.after:
        x-distributions:
          - amazon-serverless
        $ref: '#/components/schemas/_common___Duration'
        description: >-
          AOSS-only. Warm-tier migration threshold: an index older than this
          duration is migrated from hot to the warm tier. Expressed as a
          duration string (e.g. `30d`); normalized in the AOSS metadata
          service CreateIndexHandler.
      timestamp_field:
        x-distributions:
          - amazon-serverless
        $ref: '#/components/schemas/_common___Field'
        description: >-
          AOSS-only. Name of the document field holding the event timestamp,
          used by V2 collections to drive time-based data lifecycle (retention
          and warm-tier migration). Absent from OSS OpenSearch (no `Setting<>`
          counterpart); accepted by the AOSS metadata service from the
          create-index settings body, `PUT /{index}/_settings`, and
          index/component templates.

  # =========================================================================
  # 4. AOSS-only snapshot API extensions
  #    (was aoss-snapshot-api-extensions.overlay.yaml)
  #
  # Two AOSS-only extensions to the standard snapshot APIs, discovered via
  # JunoIndexingCoordinator git log + name.equals() grep (2026-08-04):
  #   1. POST /_snapshot/{repo}/{snap}/_restore
  #      - sourceCollectionId: cross-collection restore (CCR), redirects S3 path
  #      - allow_regex: enables Java regex capture-groups in rename_pattern/replacement
  #   2. GET  /_snapshot/{repo}/{snap}
  #      - sourceCollectionId: list snapshots from a source collection's repository
  #        (CCR preflight); entire source() method is AOSS-only, absent from OSS
  #
  # NOTE: crypto_settings on PUT /_snapshot/{repo} was previously listed here but
  # removed (2026-09-09): it is an OSS-native field (org.opensearch, since 2.10.0)
  # present verbatim in both OSS and JunoIndexingCoordinator PutRepositoryRequest,
  # NOT an AOSS-only extension.
  # =========================================================================
  - target: "$.components.requestBodies['snapshot.restore'].content['application/json'].schema.properties"
    description: >
      Add two AOSS-only body fields to POST /_snapshot/{repo}/{snap}/_restore.
      Both fields are absent from OSS RestoreSnapshotRequest.source() and would
      cause IllegalArgumentException: Unknown parameter on a plain OSS cluster.
    update:
      sourceCollectionId:
        x-distributions:
          - amazon-serverless
        type: string
        pattern: '^[a-z0-9]{3,40}$'
        description: >-
          AOSS-only. The ID of the source collection to restore the snapshot
          from. When set, the restore reads snapshot segment data from the
          source collection's S3 path ({accountId}/{sourceCollectionId}/)
          instead of the target collection's path, enabling cross-collection
          restore (CCR). The CCR feature flag must be enabled for the account;
          both collections must share the same type and KMS encryption context.
          Omitting this field restores from the same collection's own snapshot.
      allow_regex:
        x-distributions:
          - amazon-serverless
        type: boolean
        default: false
        description: >-
          AOSS-only. When true, interprets rename_pattern and
          rename_replacement as regular expressions using Java
          Matcher.appendReplacement semantics, allowing capture-group
          back-references (e.g. $1). When false (default), the values are
          treated as plain strings, matching standard OSS behaviour.
  - target: "$.paths['/_snapshot/{repository}/{snapshot}'].get"
    description: >
      Add an optional requestBody to GET /_snapshot/{repo}/{snap} for AOSS.
      The OSS operation has no requestBody; AOSS adds sourceCollectionId to
      allow listing snapshots from a source collection's repository as a
      CCR preflight check.
    update:
      requestBody:
        required: false
        x-distributions:
          - amazon-serverless
        description: >-
          AOSS-only. Scopes the snapshot listing to a source collection's
          repository for cross-collection restore preflight.
        content:
          application/json:
            schema:
              type: object
              x-distributions:
                - amazon-serverless
              properties:
                sourceCollectionId:
                  type: string
                  pattern: '^[a-z0-9]{3,40}$'
                  description: >-
                    AOSS-only. The ID of the source collection whose snapshot
                    repository to query. When set, the API lists snapshots from
                    the source collection's S3 repository path instead of the
                    target collection's path. Used for CCR preflight validation.
                    Requires the CCR feature flag to be enabled for the account.
