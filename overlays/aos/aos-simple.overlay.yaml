overlay: 1.0.0
info:
  title: Amazon OpenSearch Service (managed) overlay
  version: 1.0.0
extends: ./opensearch-openapi.yaml

# A simple two-part AOS overlay:
#   Part 1 -- Disabled APIs: paths the managed-domain boundary does not allow.
#   Part 2 -- Warm/Cold tier extensions: AOS-only storage-tier endpoints.
#
# Scope is grounded in the managed-domain boundary allowlist and confirmed
# against a live domain. Routes that the boundary allows but the engine does
# not implement (e.g. /_tier/all), a verb the boundary blocks (PUT on the
# migration prefix), and cold paths outside the allowlist are intentionally
# omitted.

actions:

  # =======================================================================
  # Part 1 -- Disabled APIs (removed on managed domains)
  # =======================================================================
  - target: $.paths['/_cache/clear']
    remove: true
  - target: $.paths['/_cat/nodeattrs']
    remove: true
  - target: $.paths['/_cluster/decommission/awareness']
    remove: true
  - target: $.paths['/_cluster/nodes/hot_threads']
    remove: true
  - target: $.paths['/_cluster/reroute']
    remove: true
  - target: $.paths['/_cluster/voting_config_exclusions']
    remove: true
  - target: $.paths['/_dangling']
    remove: true
  - target: $.paths['/_forcemerge']
    remove: true
  - target: $.paths['/_ingest/processor/grok']
    remove: true
  - target: $.paths['/_rank_eval']
    remove: true
  - target: $.paths['/_remotestore/_restore']
    remove: true
  - target: $.paths['/_script_context']
    remove: true
  - target: $.paths['/_script_language']
    remove: true
  - target: $.paths['/_search_shards']
    remove: true
  - target: $.paths['/_segments']
    remove: true
  - target: $.paths['/_settings']
    remove: true

  # =======================================================================
  # Part 2 -- Warm / Cold tier extensions (AOS-only)
  # =======================================================================

  # --- UltraWarm migration (hot <-> warm <-> cold) ---
  - target: "$.paths"
    description: Add UltraWarm migration endpoints
    update:
      "/_ultrawarm/migration/_status":
        get:
          operationId: ultrawarm.list_status
          tags: [UltraWarm]
          description: List all in-progress UltraWarm migrations.
          responses:
            '200': { description: Migration status list }
      "/_ultrawarm/migration/{index}/_status":
        get:
          operationId: ultrawarm.get_status
          tags: [UltraWarm]
          description: Migration status for a single index.
          parameters:
            - { name: index, in: path, required: true, schema: { type: string } }
          responses:
            '200': { description: Migration status }
      "/_ultrawarm/migration/{index}/_warm":
        post:
          operationId: ultrawarm.to_warm
          tags: [UltraWarm]
          description: Migrate an index from hot to warm storage.
          parameters:
            - { name: index, in: path, required: true, schema: { type: string } }
          responses:
            '200': { description: Migration accepted }
      "/_ultrawarm/migration/{index}/_hot":
        post:
          operationId: ultrawarm.to_hot
          tags: [UltraWarm]
          description: Migrate an index from warm back to hot storage.
          parameters:
            - { name: index, in: path, required: true, schema: { type: string } }
          responses:
            '200': { description: Migration accepted }
      "/_ultrawarm/migration/{index}/_cold":
        post:
          operationId: ultrawarm.to_cold
          tags: [UltraWarm]
          description: >-
            Migrate a warm index to cold storage. Requires start_time and
            end_time query parameters bounding the index's data.
          parameters:
            - { name: index, in: path, required: true, schema: { type: string } }
            - { name: start_time, in: query, required: true, schema: { type: string } }
            - { name: end_time, in: query, required: true, schema: { type: string } }
          responses:
            '200': { description: Migration accepted }
      "/_ultrawarm/migration/_cancel/{index}":
        post:
          operationId: ultrawarm.cancel
          tags: [UltraWarm]
          description: Cancel an in-progress UltraWarm migration.
          parameters:
            - { name: index, in: path, required: true, schema: { type: string } }
          responses:
            '200': { description: Cancellation accepted }

  # --- Cold tier read APIs (the two paths the boundary allows) ---
  - target: "$.paths"
    description: Add Cold tier read endpoints
    update:
      "/_cold/indices/_info":
        get:
          operationId: cold.indices_info
          tags: [Cold Tier]
          description: >-
            Information about cold-tier indices. Requires cold storage to be
            enabled on the domain.
          responses:
            '200': { description: Cold indices info }
      "/_cold/stats":
        get:
          operationId: cold.stats
          tags: [Cold Tier]
          description: >-
            Cold-tier storage statistics. Requires cold storage to be enabled
            on the domain.
          responses:
            '200': { description: Cold tier stats }
