# AOSS refresh parameter removal.
#
# Amazon OpenSearch Serverless rejects EVERY explicit refresh value:
#   refresh=true      -> 400 "true refresh policy is not supported."
#   refresh=wait_for  -> 400 "wait_for refresh policy is not supported."
#   refresh=false     -> 200
# (empirically verified 2026-09-02 against a real SEARCH collection). Only the
# default false works, so the write-op `refresh` query parameter is meaningless
# on AOSS and is removed entirely.
#
# This overlay requires an apply tool whose JSONPath engine supports $ref filter
# predicates (e.g. the speakeasy overlay CLI). openapi-overlays-js rejects
# @.$ref filters ("unsafe expression"); use speakeasy to apply this overlay.
overlay: 1.0.0
info:
  title: AOSS refresh parameter removal
  version: 1.0.0
actions:
  # 1. Remove every operation-level parameter that $refs a write-op refresh param.
  - target: '$.paths[*][*].parameters[?(@.$ref =~ /query\.refresh$/)]'
    remove: true
  # 2. Remove the 14 shared refresh query-parameter component definitions.
  #    components.parameters is an object map; [*] iterates its values so the
  #    [?()] predicate can match (a bare [?()] on a map matches nothing).
  - target: '$.components.parameters[*][?(@.name == "refresh" && @.in == "query")]'
    remove: true
  # 3. Remove the now-orphaned shared Refresh schema.
  - target: "$.components.schemas['_common___Refresh']"
    remove: true
