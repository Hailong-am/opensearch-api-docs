# AOSS empirical-behavior blocklist.
#
# Ops that the OSS base spec does NOT mark x-distributions-excluded=amazon-serverless
# and that the amazon-serverless.overlay.yaml does NOT remove, but which are
# empirically NON-FUNCTIONAL on a real AOSS collection: the coordinator accepts the
# request, returns an empty body, and performs no work (verified 2026-09-03 against
# a SEARCH collection in us-east-1).
#
# Evidence per op (empty response body AND no side effect):
#   POST /_reindex                  -> empty body; destination index NOT created (404 on dest _count)
#   POST /{index}/_update_by_query  -> empty body; no {"updated": N} result
#   POST /{index}/_delete_by_query  -> empty body; no {"deleted": N} result
#   + their _rethrottle task-management endpoints (only meaningful with the above)
#
# NOT removed (empirically FUNCTIONAL on AOSS, keep in the doc):
#   POST /{index}/_search?scroll= -> returns a real _scroll_id; scroll works.
#
# Applied with the speakeasy overlay CLI (path-level removes).
overlay: 1.0.0
info:
  title: AOSS empirical-behavior blocklist (non-functional write/scan ops)
  version: 1.0.0
actions:
  - target: "$.paths['/_reindex']"
    remove: true
  - target: "$.paths['/_reindex/{task_id}/_rethrottle']"
    remove: true
  - target: "$.paths['/{index}/_update_by_query']"
    remove: true
  - target: "$.paths['/_update_by_query/{task_id}/_rethrottle']"
    remove: true
  - target: "$.paths['/{index}/_delete_by_query']"
    remove: true
  - target: "$.paths['/_delete_by_query/{task_id}/_rethrottle']"
    remove: true
