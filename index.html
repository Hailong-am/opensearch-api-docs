<!doctype html>
<html>
<head>
    <title>OpenSearch API Reference</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="https://docs.opensearch.org/latest/favicon.ico">
    <link rel="shortcut icon" href="https://docs.opensearch.org/latest/favicon.ico" type="image/x-icon">
    <meta name="description" content="OpenSearch REST API reference for the OSS, Amazon OpenSearch Service, and Amazon OpenSearch Serverless distributions." />
    <!-- Open Sans — the docs.opensearch.org body/heading typeface. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      /* Page chrome only (banner + back-to-top). The per-distribution
         Scalar themes live in each configuration's `customCss` below, so
         Scalar applies the right palette to whichever document is active. */

      /* Distribution banner — Scalar custom-header pattern (CodePen
         "Scalar Custom Header Example"). The banner carries the `scalar-app`
         class, so it lives in Scalar's theme scope and inherits the active
         theme's CSS variables — it darkens/lightens natively with Scalar, no
         JS color-mirroring needed. Layout: fixed height, sticky, inset
         bottom hairline. */
      :root { --scalar-custom-header-height: 50px; }
      .os-dist-banner {
        height: var(--scalar-custom-header-height);
        background: var(--scalar-background-1);
        color: var(--scalar-color-1);
        box-shadow: inset 0 -1px 0 var(--scalar-border-color);
        font-size: 13px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        gap: 18px;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .os-dist-banner .title { font-weight: 500; color: var(--scalar-color-2); }
      .os-dist-banner img { height: 22px; width: auto; flex-shrink: 0; }
      /* Logo is a fixed-color SVG; invert it to stay legible on the dark
         banner background. (A logo can't follow a CSS color variable.) */
      body.banner-dark .os-dist-banner img { filter: brightness(0) invert(1); }
      .os-dist-banner .brand-divider {
        width: 1px; height: 20px; background: var(--scalar-border-color); flex-shrink: 0;
      }
      /* push the toggle to the right edge */
      .os-dist-banner .theme-toggle { margin-left: auto; }
      .theme-toggle {
        display: inline-flex; align-items: center; justify-content: center;
        width: 30px; height: 30px; padding: 0;
        background: transparent; border: 1px solid var(--scalar-border-color);
        border-radius: 6px; color: var(--scalar-color-2); cursor: pointer;
        transition: background-color 0.15s, border-color 0.15s;
      }
      .theme-toggle:hover {
        background: var(--scalar-background-2); border-color: var(--scalar-color-3);
      }
      /* show sun in light, moon in dark (banner-dark tracks Scalar's theme) */
      .theme-toggle .icon-moon { display: none; }
      body.banner-dark .theme-toggle .icon-sun { display: none; }
      body.banner-dark .theme-toggle .icon-moon { display: inline; }

      /* Back to top — docs.opensearch.org top-link */
      .top-link {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #003b5c;
        color: #fff;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        opacity: 0;
        pointer-events: none;
        transition: none;
        z-index: 999;
      }
      .top-link.visible {
        opacity: 0.8;
        pointer-events: auto;
      }
      .top-link:hover {
        opacity: 1;
        background: #0055a6;
      }
    </style>
</head>
<body>
    <!-- Back to top — docs.opensearch.org top-link pattern -->
    <a class="top-link" id="top-link" href="#top" onclick="event.preventDefault();window.scrollTo({top:0,behavior:'smooth'})" title="Back to top" aria-label="Back to top">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </a>
    <!-- Banner carries `scalar-app` so it inherits Scalar's theme variables
         and darkens/lightens natively. Scalar's own document switcher handles
         OSS/AOS/AOSS. -->
    <div class="os-dist-banner scalar-app">
      <img src="https://opensearch.org/wp-content/uploads/2024/08/opensearch_logo_default.svg" alt="OpenSearch" />
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="title">API Reference</span>
      <button class="theme-toggle" id="theme-toggle" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">
        <!-- sun/moon icon swaps via CSS on body.banner-dark -->
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      </button>
    </div>
    <!-- Scalar renders here -->
    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      // Back to top visibility
      window.addEventListener('scroll', () => {
        document.getElementById('top-link').classList.toggle('visible', window.scrollY > 400);
      });

      // Dark/light toggle in the banner. The banner colors now follow Scalar
      // natively via the `scalar-app` class + theme variables, so no color
      // mirroring is needed. Two things still require JS: (1) the button
      // proxies a click to Scalar's built-in color-mode toggle
      // (button.group/toggle) because flipping the .dark-mode class directly
      // is reverted by Scalar's reactive state; (2) a MutationObserver toggles
      // body.banner-dark purely so the sun/moon ICON swaps and the logo
      // inverts in step with whatever changed the theme.
      (function () {
        const btn = document.getElementById('theme-toggle');

        const isDark = () => document.querySelector('.dark-mode') !== null;
        const syncIcon = () => document.body.classList.toggle('banner-dark', isDark());

        new MutationObserver(syncIcon).observe(document.documentElement, {
          subtree: true, attributes: true, attributeFilter: ['class'],
        });

        const scalarToggle = () =>
          document.querySelector('button[class*="group/toggle"]');

        btn.addEventListener('click', () => {
          const t = scalarToggle();
          if (t) t.click();          // let Scalar own the state change
          setTimeout(syncIcon, 0);   // reflect it after Scalar re-renders
        });

        syncIcon();
      })();


      // Options shared by every distribution configuration.
      const base = {
        theme: 'none',
        layout: 'modern',
        tagsSorter: 'alpha',
        darkMode: false,
        favicon: 'https://docs.opensearch.org/latest/favicon.ico',
        showSidebar: true,
        operationTitleSource: 'path',
        defaultOpenFirstTag: true,
        defaultOpenAllTags: false,
        hideModels: true,
        expandAllResponses: true,
        orderSchemaPropertiesBy: 'preserve',
        showDeveloperTools: 'never',
        hideTestRequestButton: true,
        hideClientButton: true,
        agent: { disabled: true },
        mcp: { disabled: true, name: '', url: '' },
        hideDownloadButton: false,
        documentDownloadType: 'both',
        searchHotKey: 'k',
        defaultHttpClient: { targetKey: 'shell', clientKey: 'curl' },
        hiddenClients: [],
        telemetry: false,
      };

      // OpenSearch (OSS) palette — docs.opensearch.org: navy sidebar,
      // link #0055A6, secondary accent #00a3e0.
      const openSearchCss = `
        .light-mode {
          --scalar-font: "Open Sans", "Segoe UI", Tahoma, sans-serif;
          --scalar-color-1: #002a3a;
          --scalar-color-2: rgba(0, 59, 92, 0.7);
          --scalar-color-3: rgba(0, 59, 92, 0.45);
          --scalar-color-accent: #0055a6;
          --scalar-background-1: #ffffff;
          --scalar-background-2: #f5f7f7;
          --scalar-background-3: #eef1f6;
          --scalar-background-accent: rgba(0, 85, 166, 0.08);
          --scalar-border-color: rgba(0, 59, 92, 0.1);
          --scalar-color-green: #0055a6;
          --scalar-color-blue: #005eb8;
          --scalar-color-orange: #ef6c00;
          --scalar-color-red: #c62828;
        }
        .light-mode .sidebar {
          --scalar-sidebar-background-1: #003b5c;
          --scalar-sidebar-item-hover-color: #ffffff;
          --scalar-sidebar-item-hover-background: rgba(255, 255, 255, 0.1);
          --scalar-sidebar-item-active-background: rgba(0, 163, 224, 0.3);
          --scalar-sidebar-border-color: rgba(255, 255, 255, 0.1);
          --scalar-sidebar-color-1: rgba(255, 255, 255, 0.95);
          --scalar-sidebar-color-2: rgba(255, 255, 255, 0.7);
          --scalar-sidebar-color-active: #ffffff;
          --scalar-sidebar-search-background: rgba(255, 255, 255, 0.1);
          --scalar-sidebar-search-border-color: rgba(255, 255, 255, 0.15);
          --scalar-sidebar-search-color: rgba(255, 255, 255, 0.5);
        }
        .dark-mode {
          --scalar-font: "Open Sans", "Segoe UI", Tahoma, sans-serif;
          --scalar-color-1: rgba(255, 255, 255, 0.9);
          --scalar-color-2: rgba(255, 255, 255, 0.55);
          --scalar-color-3: rgba(255, 255, 255, 0.35);
          --scalar-color-accent: #00a3e0;
          --scalar-background-1: #0d1b2a;
          --scalar-background-2: #132238;
          --scalar-background-3: #1a2d47;
          --scalar-background-accent: rgba(0, 163, 224, 0.1);
          --scalar-border-color: rgba(255, 255, 255, 0.08);
          --scalar-color-green: #00a3e0;
          --scalar-color-blue: #46bde9;
          --scalar-color-orange: #ffa040;
          --scalar-color-red: #ef5350;
        }
        .dark-mode .sidebar {
          --scalar-sidebar-background-1: #091521;
          --scalar-sidebar-item-hover-color: #ffffff;
          --scalar-sidebar-item-hover-background: rgba(255, 255, 255, 0.05);
          --scalar-sidebar-item-active-background: rgba(0, 163, 224, 0.15);
          --scalar-sidebar-border-color: rgba(255, 255, 255, 0.06);
          --scalar-sidebar-color-1: rgba(255, 255, 255, 0.85);
          --scalar-sidebar-color-2: rgba(255, 255, 255, 0.5);
          --scalar-sidebar-color-active: #00a3e0;
          --scalar-sidebar-search-background: rgba(255, 255, 255, 0.06);
          --scalar-sidebar-search-border-color: rgba(255, 255, 255, 0.08);
          --scalar-sidebar-search-color: rgba(255, 255, 255, 0.35);
        }
      `;

      // AWS palette removed: Scalar injects config-level customCss globally
      // (no per-active-config scoping hook exists), so per-distribution
      // themes collide. All distributions share the OpenSearch theme; the
      // native document switcher moves between them without a reload.
      Scalar.createApiReference('#app', {
        ...base,
        customCss: openSearchCss,
        sources: [
          {
            slug: 'oss',
            title: 'OpenSearch (OSS)',
            url: 'build/opensearch-openapi-oss-tagged.json',
            default: true,
          },
          {
            slug: 'aos',
            title: 'Amazon OpenSearch Service',
            url: 'build/opensearch-openapi-aos-tagged.json',
          },
          {
            slug: 'aoss',
            title: 'Amazon OpenSearch Serverless',
            url: 'build/opensearch-openapi-aoss-tagged.json',
          },
        ],
      });
    </script>
</body>
</html>
