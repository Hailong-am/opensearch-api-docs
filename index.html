---
<!doctype html>
<html>
<head>
    <title>OpenSearch API Reference</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <!-- Open Sans — the docs.opensearch.org body/heading typeface. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      /* Page chrome only (banner + back-to-top). The per-distribution
         Scalar themes live in each configuration's `customCss` below, so
         Scalar applies the right palette to whichever document is active. */

      /* Distribution banner — mimics Scalar's custom-header layout
         (CodePen "Scalar Custom Header Example"): fixed height, sticky,
         space-between, inset bottom hairline. Colors are pinned to the
         docs.opensearch.org light palette (NOT theme vars), so the banner
         stays light in every theme. */
      :root { --scalar-custom-header-height: 50px; }
      .os-dist-banner {
        height: var(--scalar-custom-header-height);
        background: #e1f0f9;
        color: #003b5c;
        box-shadow: inset 0 -1px 0 rgba(0, 59, 92, 0.12);
        font-size: 13px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        font-family: "Open Sans", "Segoe UI", Tahoma, sans-serif;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .os-dist-banner .title { font-weight: 500; }
      .os-dist-banner img { height: 22px; width: auto; flex-shrink: 0; }

      /* Back to top — docs.opensearch.org top-link */
      .top-link {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #003b5c;
        color: #fff;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        opacity: 0;
        pointer-events: none;
        transition: none;
        z-index: 999;
      }
      .top-link.visible {
        opacity: 0.8;
        pointer-events: auto;
      }
      .top-link:hover {
        opacity: 1;
        background: #0055a6;
      }
    </style>
</head>
<body>
    <!-- Back to top — docs.opensearch.org top-link pattern -->
    <a class="top-link" id="top-link" href="#top" onclick="event.preventDefault();window.scrollTo({top:0,behavior:'smooth'})" title="Back to top" aria-label="Back to top">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </a>
    <!-- Static banner (Scalar's own document switcher handles OSS/AOS/AOSS) -->
    <div class="os-dist-banner">
      <img src="https://opensearch.org/wp-content/uploads/2024/08/opensearch_logo_default.svg" alt="OpenSearch" />
      <span class="title">API Reference</span>
    </div>
    <!-- Scalar renders here -->
    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      // Back to top visibility
      window.addEventListener('scroll', () => {
        document.getElementById('top-link').classList.toggle('visible', window.scrollY > 400);
      });

      // Options shared by every distribution configuration.
      const base = {
        theme: 'none',
        layout: 'modern',
        tagsSorter: 'alpha',
        darkMode: false,
        favicon: 'favicon.ico',
        showSidebar: true,
        operationTitleSource: 'path',
        defaultOpenFirstTag: true,
        defaultOpenAllTags: false,
        hideModels: true,
        expandAllResponses: true,
        orderSchemaPropertiesBy: 'preserve',
        showDeveloperTools: 'never',
        hideTestRequestButton: true,
        hideClientButton: true,
        agent: { disabled: true },
        mcp: { disabled: true, name: '', url: '' },
        hideDownloadButton: false,
        documentDownloadType: 'both',
        searchHotKey: 'k',
        defaultHttpClient: { targetKey: 'shell', clientKey: 'curl' },
        hiddenClients: [],
        telemetry: false,
      };

      // OpenSearch (OSS) palette — docs.opensearch.org: navy sidebar,
      // link #0055A6, secondary accent #00a3e0.
      const openSearchCss = `
        .light-mode {
          --scalar-font: "Open Sans", "Segoe UI", Tahoma, sans-serif;
          --scalar-color-1: #002a3a;
          --scalar-color-2: rgba(0, 59, 92, 0.7);
          --scalar-color-3: rgba(0, 59, 92, 0.45);
          --scalar-color-accent: #0055a6;
          --scalar-background-1: #ffffff;
          --scalar-background-2: #f5f7f7;
          --scalar-background-3: #eef1f6;
          --scalar-background-accent: rgba(0, 85, 166, 0.08);
          --scalar-border-color: rgba(0, 59, 92, 0.1);
          --scalar-color-green: #0055a6;
          --scalar-color-blue: #005eb8;
          --scalar-color-orange: #ef6c00;
          --scalar-color-red: #c62828;
        }
        .light-mode .sidebar {
          --scalar-sidebar-background-1: #003b5c;
          --scalar-sidebar-item-hover-color: #ffffff;
          --scalar-sidebar-item-hover-background: rgba(255, 255, 255, 0.1);
          --scalar-sidebar-item-active-background: rgba(0, 163, 224, 0.3);
          --scalar-sidebar-border-color: rgba(255, 255, 255, 0.1);
          --scalar-sidebar-color-1: rgba(255, 255, 255, 0.95);
          --scalar-sidebar-color-2: rgba(255, 255, 255, 0.7);
          --scalar-sidebar-color-active: #ffffff;
          --scalar-sidebar-search-background: rgba(255, 255, 255, 0.1);
          --scalar-sidebar-search-border-color: rgba(255, 255, 255, 0.15);
          --scalar-sidebar-search-color: rgba(255, 255, 255, 0.5);
        }
        .dark-mode {
          --scalar-font: "Open Sans", "Segoe UI", Tahoma, sans-serif;
          --scalar-color-1: rgba(255, 255, 255, 0.9);
          --scalar-color-2: rgba(255, 255, 255, 0.55);
          --scalar-color-3: rgba(255, 255, 255, 0.35);
          --scalar-color-accent: #00a3e0;
          --scalar-background-1: #0d1b2a;
          --scalar-background-2: #132238;
          --scalar-background-3: #1a2d47;
          --scalar-background-accent: rgba(0, 163, 224, 0.1);
          --scalar-border-color: rgba(255, 255, 255, 0.08);
          --scalar-color-green: #00a3e0;
          --scalar-color-blue: #46bde9;
          --scalar-color-orange: #ffa040;
          --scalar-color-red: #ef5350;
        }
        .dark-mode .sidebar {
          --scalar-sidebar-background-1: #091521;
          --scalar-sidebar-item-hover-color: #ffffff;
          --scalar-sidebar-item-hover-background: rgba(255, 255, 255, 0.05);
          --scalar-sidebar-item-active-background: rgba(0, 163, 224, 0.15);
          --scalar-sidebar-border-color: rgba(255, 255, 255, 0.06);
          --scalar-sidebar-color-1: rgba(255, 255, 255, 0.85);
          --scalar-sidebar-color-2: rgba(255, 255, 255, 0.5);
          --scalar-sidebar-color-active: #00a3e0;
          --scalar-sidebar-search-background: rgba(255, 255, 255, 0.06);
          --scalar-sidebar-search-border-color: rgba(255, 255, 255, 0.08);
          --scalar-sidebar-search-color: rgba(255, 255, 255, 0.35);
        }
      `;

      // AWS palette removed: Scalar injects config-level customCss globally
      // (no per-active-config scoping hook exists), so per-distribution
      // themes collide. All distributions share the OpenSearch theme; the
      // native document switcher moves between them without a reload.
      Scalar.createApiReference('#app', {
        ...base,
        customCss: openSearchCss,
        sources: [
          {
            slug: 'oss',
            title: 'OpenSearch (OSS)',
            url: 'build/opensearch-openapi-oss-tagged.json',
            default: true,
          },
          {
            slug: 'aos',
            title: 'Amazon OpenSearch Service',
            url: 'build/opensearch-openapi-aos-tagged.json',
          },
          {
            slug: 'aoss',
            title: 'Amazon OpenSearch Serverless',
            url: 'build/opensearch-openapi-aoss-tagged.json',
          },
        ],
      });
    </script>
</body>
</html>
